name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web deps (esbuild)
        run: cd web && npm install --no-audit --no-fund

      - name: Build web (esbuild single file)
        run: cd web && node build.mjs

      - name: Copy web assets into Android
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -r web/dist/. android/app/src/main/assets/web/
          echo "--- assets ---"
          ls android/app/src/main/assets/web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          KS="$RUNNER_TEMP/keystore.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "使用仓库 Secret 里的 keystore"
          else
            keytool -genkeypair -v -keystore "$KS" -alias skinstudio \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass skinstudio -keypass skinstudio \
              -dname "CN=Skin Studio, OU=App, O=Personal, L=CN, S=CN, C=CN"
            echo "GENERATED_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "::warning::首次构建已生成 keystore。请下载 keystore artifact 并配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS，否则下次构建签名会变，无法覆盖安装。"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-skinstudio}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS:-skinstudio}" >> "$GITHUB_ENV"

      - name: Install Android SDK (commandline-tools)
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble release
        run: |
          cd android
          VERSION=$(node -p "require('../web/package.json').version")
          gradle assembleRelease -PversionName="$VERSION" --no-daemon

      - name: Verify apk
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump badging "$APK" | head -5
          unzip -l "$APK" | grep -E "assets/web/index.html|assets/web/app.js" > /dev/null
          unzip -l "$APK" | grep -E "assets/web/assets/roche/index.html" > /dev/null
          echo "包内校验通过：index.html + app.js + 真实应用资源都在"
          echo "APK 体积：$(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skin-studio-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload keystore (first build only)
        if: env.GENERATED_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-first-build
          path: ${{ env.KEYSTORE_PATH }}

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
